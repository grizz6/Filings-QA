name: Keep app awake

# Streamlit Community Cloud puts an app to sleep after 12 hours without visitors. This opens
# the app in a headless browser every 4 hours, around the clock, so it never reaches that
# limit even when GitHub starts a scheduled run hours late. If the app is already asleep it
# is woken up. A failure (the app does not load) fails the run and GitHub emails the owner.
on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - checks/keep_awake.py
      - .github/workflows/keep-awake.yml

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ vars.APP_URL || 'https://filings.streamlit.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright with Chromium
        run: |
          pip install "playwright>=1.45"
          python -m playwright install --with-deps chromium
      - name: Open the app
        run: python checks/keep_awake.py
      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake
          path: keep-awake.png
          if-no-files-found: ignore
