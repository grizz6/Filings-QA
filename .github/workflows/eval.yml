name: Experiments

# Day 7: run every experiment in eval/experiments.yaml on the 50-question test set and log
# params + metrics to MLflow. The MLflow database is uploaded as the "mlflow" artifact:
#   download it, then:  pip install mlflow && mlflow ui --backend-store-uri sqlite:///mlflow.db
# The results table also appears on the run's summary page.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/evaluate.py
      - eval/experiments.yaml
      - eval/test_set.jsonl
      - .github/workflows/eval.yml

permissions:
  contents: read

concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-eval.txt
      - name: Build Risk Factors sections
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m src.download
          python -m src.parse
      - name: Run experiments (retrieval metrics + refusal rate) and log to MLflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m src.evaluate --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow
          path: |
            mlflow.db
            data/eval/*.json
          retention-days: 90
