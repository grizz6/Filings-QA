name: Weekly monitor

# Day 10: scheduled checks that need no person and no LLM quota.
# - data: re-download the latest 10-Ks and re-run the test-set verify + retrieval gate.
#   Fails when a company files a new 10-K that changes the text (refresh the test set and
#   re-index) or when retrieval quality drifts below eval/thresholds.yaml.
# - usage: last 7 days of the app's question log (volume, refusals, latency, confidence).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-index.txt
      - name: Rebuild sections and chunks from the latest filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m src.download
          python -m src.parse
          python -m src.chunk
      - name: Test-set quotes still match the filings
        run: python -m src.testset verify
      - name: Retrieval quality gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m src.evaluate --gate

  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt "psycopg[binary]>=3.2"
      - name: Usage report (also on the run's summary page)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m src.monitor --days 7
