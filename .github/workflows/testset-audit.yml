name: Test set audit

# Day 6 check: for each of the 50 questions, Gemini reads the company's ENTIRE Risk Factors
# section and says whether it answers the question, with an exact sentence that is checked
# against the section. Fails if an "unanswerable" question is answered there, or an
# answerable one is not supported. ~50 Gemini calls (free tier), ~6 minutes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - eval/test_set.jsonl
      - src/testset.py
      - .github/workflows/testset-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Build Risk Factors sections
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m src.download
          python -m src.parse
      - name: Audit every question against its full section
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.testset audit
