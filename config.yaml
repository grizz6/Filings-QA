# All tunable settings live here so experiments change config, not code.

companies:  # ticker -> name (Day 2 downloads the latest 10-K for each)
  AAPL: Apple
  MSFT: Microsoft
  TSLA: Tesla
  JPM: JPMorgan Chase
  WMT: Walmart
  PFE: Pfizer
  XOM: Exxon Mobil
  NKE: Nike
  NFLX: Netflix
  DAL: Delta Air Lines

# Extra names people use for a company in questions (ticker, full name and first word of
# the name are always recognized). Used to search only that company's filing.
aliases:
  JPM: [jp morgan, jpmorganchase, chase]
  XOM: [exxonmobil]
  DAL: [delta airlines]

# Use a specific SEC CIK instead of the one SEC's ticker list gives.
# XOM: Exxon redomiciled to a new Texas holding company on 2026-07-01 that took over the
# ticker (new CIK 2115436) but has not filed a 10-K yet; the 10-Ks are under the old CIK.
cik_overrides:
  XOM: 34088

chunking:
  size_words: 400
  overlap_words: 50

retrieval:
  top_k: 5
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

llm:
  provider: gemini
  endpoint: https://generativelanguage.googleapis.com/v1beta
  model: gemini-3.8-flash
  temperature: 0.0
  max_tokens: 2048  # leave room: some Gemini models spend output tokens on thinking
